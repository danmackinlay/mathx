[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mathx"
version = "0.1.0"
description = "A maths oracle for AI agents — sample wide, vote, return JSON."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dan MacKinlay" }]
dependencies = [
    "openai>=1.0",
    "math-verify>=0.5",
    "click>=8.1",
    "mcp>=1.2",
    "sympy>=1.13",  # checker scripts are promised sympy (executor -I keeps site-packages importable)
]

[project.scripts]
mathx = "mathx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",  # mock transport for the fake OpenAI-compatible endpoint in tests
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff's classic default set, pinned against default drift

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mathx"]
